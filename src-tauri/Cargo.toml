cargo-features = ["trim-paths"]
[package]
name = "paper_format_checker"
version = "1.0.0"
description = "LaTeX paper format checker"
authors = ["blend-tea"]
edition = "2021"

[lib]
name = "paper_format_checker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-toml"] }

[dependencies]
tauri = { version = "2", features = ["config-toml"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.dev]
panic = "abort"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"
panic = "abort"
trim-paths = "all"
