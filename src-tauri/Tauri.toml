"$schema" = "https://schema.tauri.app/config/2"
product-name = "paper_format_checker"
version = "1.0.0"
identifier = "com.paper-format-checker"

[build]
before-dev-command = "npm run dev"
before-build-command = "npm run build"
dev-url = "http://localhost:1420"
frontend-dist = "../dist"

[[app.windows]]
label = "main"
title = "paper_format_checker"
width = 800
height = 600
drag-drop-enabled = true

[bundle]
active = true
targets = "all"
icon = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]
resources = ["../rules.toml"]
